name: Publish packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag; publish release candidates to next before stable latest.
        required: true
        type: choice
        options: [next, latest]

permissions:
  contents: read

jobs:
  # Dependency installation, builds, tests and packing run without an OIDC token in scope.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22.14.0, cache: npm }
      - run: npm install --global npm@11.5.2
      - run: npm --version
      - run: npm ci
      # The dist-tag reaches the shell as an environment variable, never as expression interpolation.
      - run: node scripts/assert-release-channel.mjs "$RELEASE_TAG"
        env: { RELEASE_TAG: "${{ inputs.tag }}" }
      - run: npm run release:verify
      - run: node scripts/pack-packages.mjs dist-pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarballs
          path: dist-pack/
          if-no-files-found: error
          retention-days: 1

  # Minimal privileged job: only the already-verified tarballs reach npm's OIDC exchange.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22.14.0, registry-url: https://registry.npmjs.org }
      # npm trusted publishing requires npm >= 11.5.1. Pin the CLI rather than
      # relying on the older npm bundled with the selected Node release.
      - run: npm install --global npm@11.5.2
      - run: npm --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: package-tarballs, path: dist-pack }
      - name: Publish verified packages in dependency order
        shell: bash
        run: |
          mapfile -t ordered_tarballs < dist-pack/publish-order.txt
          mapfile -t actual_tarballs < <(find dist-pack -maxdepth 1 -type f -name '*.tgz' -printf '%f\n' | sort)
          mapfile -t expected_tarballs < <(printf '%s\n' "${ordered_tarballs[@]}" | sort)
          if [[ "${#ordered_tarballs[@]}" -ne 14 ]] || ! diff -u <(printf '%s\n' "${expected_tarballs[@]}") <(printf '%s\n' "${actual_tarballs[@]}"); then
            printf 'Expected exactly the 14 verified Roost2D package tarballs.\n' >&2
            exit 1
          fi
          package_field() {
            tar -xOf "$1" package/package.json | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => console.log(JSON.parse(input)[process.argv[1]]));
            ' "$2"
          }
          tarball_integrity() {
            node -e '
              const { createHash } = require("node:crypto");
              const { readFileSync } = require("node:fs");
              console.log(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`);
            ' "$1"
          }
          for tarball in "${ordered_tarballs[@]}"; do
            if [[ ! "$tarball" =~ ^[A-Za-z0-9._-]+\.tgz$ ]]; then
              printf 'Unsafe tarball name: %s\n' "$tarball" >&2
              exit 1
            fi
            tarball_path="./dist-pack/$tarball"
            package_name="$(package_field "$tarball_path" name)"
            package_version="$(package_field "$tarball_path" version)"
            package_spec="$package_name@$package_version"
            local_integrity="$(tarball_integrity "$tarball_path")"
            published_integrity="$(npm view "$package_spec" dist.integrity 2>/dev/null || true)"
            if [[ -n "$published_integrity" ]]; then
              if [[ "$published_integrity" != "$local_integrity" ]]; then
                printf 'Refusing to resume: %s exists with different integrity.\n' "$package_spec" >&2
                exit 1
              fi
              published_tag="$(npm view "$package_name" "dist-tags.$RELEASE_TAG" 2>/dev/null || true)"
              if [[ "$published_tag" != "$package_version" ]]; then
                printf 'Refusing to resume: %s exists but tag %s points to %s. Repair the tag through an authorized operator.\n' "$package_spec" "$RELEASE_TAG" "${published_tag:-nothing}" >&2
                exit 1
              fi
              printf 'Verified existing %s; continuing resumable publish.\n' "$package_spec"
            else
              npm publish "$tarball_path" --access public --tag "$RELEASE_TAG"
            fi
          done
          for tarball in "${ordered_tarballs[@]}"; do
            tarball_path="./dist-pack/$tarball"
            package_name="$(package_field "$tarball_path" name)"
            package_version="$(package_field "$tarball_path" version)"
            verified=false
            for attempt in {1..6}; do
              published_version="$(npm view "$package_name@$package_version" version 2>/dev/null || true)"
              published_tag="$(npm view "$package_name" "dist-tags.$RELEASE_TAG" 2>/dev/null || true)"
              if [[ "$published_version" == "$package_version" && "$published_tag" == "$package_version" ]]; then
                verified=true
                break
              fi
              sleep 5
            done
            if [[ "$verified" != true ]]; then
              printf 'Registry postflight failed for %s@%s on tag %s.\n' "$package_name" "$package_version" "$RELEASE_TAG" >&2
              exit 1
            fi
            printf 'Registry postflight passed for %s@%s (%s).\n' "$package_name" "$package_version" "$RELEASE_TAG"
          done

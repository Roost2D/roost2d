name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22.14.0, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test
      - run: npm run build:smoke
      - run: npm run smoke
      - run: npm run build:showcase
      - run: npm run docs:build
      - run: node packages/tooling/dist/cli.js verify-boundary packages/tooling/src
      - run: node packages/tooling/dist/cli.js verify-package-boundary packages/tooling/package.json
      - run: node scripts/verify-packs.mjs
